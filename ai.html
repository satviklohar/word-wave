<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Script Chat — Word Wave</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="ai.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Chat history">
    <a href="index.html" class="logo"><img class="logo-img" src="logo.svg" alt=""><span class="wm">Word <em>Wave</em></span></a>
    <button class="new" id="newChat" type="button">＋ New script chat</button>
    <p class="hist-title">Recent</p>
    <ul id="history"></ul>
    <button class="side-link keybtn" id="keyBtn" type="button" hidden>🔑 API key</button>
    <a class="side-link" href="index.html">← Landing page</a>
  </aside>
  <div class="scrim" id="scrim"></div>

  <section class="chat">
    <header class="top">
      <button class="icon" id="menu" type="button" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="top-title">Word Wave AI</span>
      <a href="index.html" class="top-home">Home</a>
    </header>

    <div class="thread" id="thread">
      <div class="welcome" id="welcome">
        <div class="avatar big"><img src="logo.svg" alt=""></div>
        <h1>What are we writing today?</h1>
        <div class="chips">
          <button type="button" class="chip">🎬 A heist comedy set in a public library</button>
          <button type="button" class="chip">📱 30-second Reel script about morning coffee</button>
          <button type="button" class="chip">🎙 Podcast intro for a true-crime show</button>
          <button type="button" class="chip">🤖 Dialogue between a robot and its creator</button>
        </div>
      </div>
      <div class="msgs" id="msgs"></div>
    </div>

    <div class="tb-wrap"><button class="to-bottom" id="toBottom" type="button" aria-label="Scroll to latest" hidden>↓</button></div>
    <form class="composer" id="composer" autocomplete="off">
      <div class="attach-prev" id="attachPrev" hidden>
        <img id="prevImg" alt="Attached image">
        <button type="button" id="rmImg" aria-label="Remove image">×</button>
      </div>
      <div class="box">
        <button type="button" class="icon" id="attach" aria-label="Attach an image">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/></svg>
        </button>
        <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
        <textarea id="input" rows="1" placeholder="Message Word Wave…" aria-label="Message"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="opts">
        <label class="pill"><span>Format</span>
          <select id="format" aria-label="Format"><option>screenplay</option><option>YouTube video</option><option>podcast episode</option><option>Reel / Short</option><option>stage play</option><option>ad spot</option></select>
        </label>
        <label class="pill"><span>Genre</span>
          <select id="genre" aria-label="Genre"><option>drama</option><option>comedy</option><option>thriller</option><option>sci-fi</option><option>horror</option><option>romance</option></select>
        </label>
        <label class="pill"><span>Length</span>
          <select id="length" aria-label="Length"><option>short (1 scene)</option><option>medium (3 scenes)</option><option>long (5+ scenes)</option></select>
        </label>
      </div>
    </form>
  </section>
</div>
<div class="keymodal" id="keyModal" hidden>
  <form class="keycard" id="keyForm">
    <h3>Connect your Groq key</h3>
    <p>This site has no server, so it talks to Groq directly from your browser. Get a free key at
      <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>.
      It's saved only in this browser and sent only to Groq.</p>
    <input id="keyInput" type="password" placeholder="gsk_…" autocomplete="off" spellcheck="false" aria-label="Groq API key">
    <div class="keyacts"><button type="button" class="act" id="keyCancel">Cancel</button><button type="submit" class="savekey">Save &amp; continue</button></div>
  </form>
</div>
<script src="ai.js"></script>
</body>
</html>
